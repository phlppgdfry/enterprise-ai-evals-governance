name: Evaluation quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - run: python -m pip check
      - run: python scripts/export_openapi.py --check
      - name: Positive control must pass
        run: evalgov --fixture good --out reports/good
      - name: Negative control must block release
        shell: bash
        run: |
          set +e
          evalgov --fixture unsafe --baseline reports/good/report.json --out reports/unsafe
          status=$?
          set -e
          test "$status" -eq 1
      - name: Install isolated quality tools
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install -r requirements-quality.lock
      - name: Lint application and tests
        run: .quality-venv/bin/python -m ruff check --select E4,E7,E9,F evalgov tests scripts
      - name: Dependency vulnerability gate
        run: |
          mkdir -p reports
          .quality-venv/bin/python -m pip_audit -r requirements.lock --no-deps --disable-pip --format json --output reports/dependency-audit.json
      - name: Clean wheel installation gate
        run: python scripts/release_check.py --output reports/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-evidence
          path: reports/
          retention-days: 14
