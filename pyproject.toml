[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-evals-governance"
version = "0.1.0"
description = "Reproducible AI evaluation gates and a small governance decision service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
evalgov = "evalgov.cli:main"

[tool.setuptools.packages.find]
include = ["evalgov*"]

[tool.setuptools.package-data]
evalgov = ["datasets/*.json", "datasets/*.jsonl", "console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
